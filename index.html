<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920, height=1080">
  <title>Hush Home</title>
  <style>body { background: #0b0c0e; margin: 0; } #stage { visibility: hidden; }</style>
</head>
<body data-theme="graphite">
  <div id="stage">
    <section id="who" class="screen">
      <h1 class="who-title">Who's watching?</h1>
      <div class="who-row">
        <button class="person focusable" data-profile="p1">
          <span class="avatar lift"></span>
          <span class="person-name">User 1</span>
        </button>
        <button class="person focusable" data-profile="p2">
          <span class="avatar lift"></span>
          <span class="person-name">User 2</span>
        </button>
      </div>
      <p class="who-hint" id="who-hint"></p>
    </section>

    <section id="home" class="screen" hidden>
      <header class="top">
        <div>
          <div class="clock" id="clock">9:41</div>
          <div class="date" id="date"></div>
        </div>
        <button class="me focusable" id="me" data-row="0">
          <span class="me-avatar" id="me-avatar"></span>
          <span class="me-name" id="me-name"></span>
        </button>
      </header>

      <main>
        <h2 class="greeting" id="greeting">Good evening</h2>
        <div class="apps" id="apps"></div>
        <div class="cards" id="cards"></div>
      </main>

      <footer class="bottom">
        <span class="mark">hush</span>
        <span class="hint">◀ ▶ move&nbsp;&nbsp;·&nbsp;&nbsp;OK open</span>
      </footer>
    </section>
  </div>
  <script>
    // jsdelivr caches branch urls for hours, so pin the css and js to the newest commit;
    // falls back to the copies next to this file when github can't be reached
    (function () {
      var base = 'https://cdn.jsdelivr.net/gh/notalim/hush-home';
      var started = false;

      function load(ref) {
        if (started) return;
        started = true;
        var root = ref ? base + '@' + ref : '.';
        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = root + '/style.css';
        css.onload = show;
        document.head.appendChild(css);
        setTimeout(show, 1500);
        var js = document.createElement('script');
        js.src = root + '/app.js';
        document.body.appendChild(js);
      }

      function show() {
        document.getElementById('stage').style.visibility = 'visible';
      }

      if (location.port === '8899') return load(null);
      var req = new XMLHttpRequest();
      req.open('GET', 'https://api.github.com/repos/notalim/hush-home/commits/main', true);
      req.setRequestHeader('Accept', 'application/vnd.github.sha');
      req.timeout = 2500;
      req.onload = function () {
        var sha = (req.responseText || '').trim();
        load(req.status === 200 && /^[0-9a-f]{40}$/.test(sha) ? sha : null);
      };
      req.onerror = req.ontimeout = function () { load(null); };
      req.send();
    })();
  </script>
</body>
</html>
